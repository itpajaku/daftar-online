openapi: 3.0.3
info:
  title: API Permohonan Akun E-Court
  description: API untuk mengirimkan permohonan pendaftaran akun e-court (Identitas dan Rekening Bank).
  version: 1.0.0
servers:
  - url: /api
    description: Base URL untuk semua endpoint API permohonan.
paths:
  /:
    get:
      summary: Health Check
      description: Endpoint untuk mengecek status kesehatan API.
      operationId: getHealthStatus
      responses:
        '200':
          description: API berjalan normal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "API is running"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-07-20T10:00:00Z"
  
  /permohonan/step-1:
    post:
      summary: Step 1 - Pendaftaran Identitas
      description: Membuat permohonan akun dengan mengisi data identitas diri.
      operationId: createIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRequest'
      responses:
        '201':
          description: Data identitas berhasil disimpan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step1SuccessResponse'
        '422':
          description: Validasi gagal (misal duplikasi NIK atau no telepon, atau field wajib kosong).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Terjadi kesalahan server.
  
  /permohonan/step-2/{identity_id}:
    post:
      summary: Step 2 - Pendaftaran Rekening Bank & KTP
      description: Melengkapi data rekening bank dan mengunggah dokumen KTP berdasarkan `identity_id` yang didapatkan dari Step 1.
      operationId: createBankAccount
      parameters:
        - name: identity_id
          in: path
          required: true
          description: Hashed ID dari identitas yang didapatkan pada Step 1.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
      responses:
        '200':
          description: Data rekening bank dan KTP berhasil disimpan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step2SuccessResponse'
        '404':
          description: ID Identitas tidak valid atau tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Validasi gagal (misalnya format file KTP salah atau kebesaran).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Terjadi kesalahan server.
  
  /permohonan/status/{identity_id}:
    get:
      summary: Cek Status E-Court Account
      description: Menampilkan status akun e-court (beserta username dan password) yang sudah diverifikasi atau dibuat oleh admin.
      operationId: getEcourtStatus
      parameters:
        - name: identity_id
          in: path
          required: true
          description: Hashed ID dari identitas.
          schema:
            type: string
      responses:
        '200':
          description: Status akun berhasil diambil. Jika data ada, maka akan mengembalikan username dan password e-court. Jika masih dalam proses, data bernilai null dan status 'pending'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: ID Identitas tidak valid atau tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  
  /permohonan/identity/{identity_id}:
    get:
      summary: Detail Identitas
      description: Mengambil data identitas beserta data rekening bank dan KTP jika ada, berdasarkan `identity_id`. Data Nomor KTP dan Nomor Telepon akan dikembalikan dalam format asli (tidak terenkripsi).
      operationId: getIdentity
      parameters:
        - name: identity_id
          in: path
          required: true
          description: Hashed ID dari identitas.
          schema:
            type: string
      responses:
        '200':
          description: Data identitas berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityDetailResponse'
        '404':
          description: ID Identitas tidak valid atau tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
components:
  schemas:
    IdentityRequest:
      type: object
      required:
        - nama_lengkap
        - jenis_kelamin
        - tanggal_lahir
        - tempat_lahir
        - nomor_kependudukan
        - nomor_telepon
        - email
        - pekerjaan
        - pendidikan
        - status_perkawinan
        - agama
        - alamat
      properties:
        nama_lengkap:
          type: string
          example: "Budi Santoso"
        jenis_kelamin:
          type: string
          enum: [Laki-laki, Perempuan]
          example: "Laki-laki"
        tanggal_lahir:
          type: string
          format: date
          example: "1990-01-01"
        tempat_lahir:
          type: string
          example: "Jakarta"
        nomor_kependudukan:
          type: string
          description: NIK, berupa angka hingga 20 digit.
          example: "3171234567890123"
        nomor_telepon:
          type: string
          description: Nomor telepon/WA. Berupa angka.
          example: "81234567890"
        email:
          type: string
          format: email
          example: "budisantoso@example.com"
        pekerjaan:
          type: string
          example: "Karyawan Swasta"
        pendidikan:
          type: string
          example: "S1"
        status_perkawinan:
          type: string
          example: "Belum Kawin"
        agama:
          type: string
          example: "Islam"
        alamat:
          type: string
          example: "Jl. Sudirman No 1, Jakarta"

    BankAccountRequest:
      type: object
      required:
        - nama_bank
        - nomor_rekening
        - nama_akun
        - file_ktp
      properties:
        nama_bank:
          type: string
          example: "BCA"
        nomor_rekening:
          type: string
          example: "1234567890"
        nama_akun:
          type: string
          description: Nama pada rekening.
          example: "Budi Santoso"
        file_ktp:
          type: string
          format: binary
          description: File KTP dalam format PDF (maks 2MB).

    Step1SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Data identitas berhasil disimpan."
        data:
          type: object
          properties:
            identity_id:
              type: string
              example: "abc123xyz"

    Step2SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Data rekening bank dan KTP berhasil disimpan."
        data:
          type: object
          properties:
            bank_account_id:
              type: string
              example: "def456uvw"

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Akun E-Court sudah dibuat oleh admin."
        data:
          type: object
          nullable: true
          properties:
            username:
              type: string
              example: "ecourt_user_123"
            password:
              type: string
              example: "password123"

    IdentityDetailResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Data identitas berhasil diambil."
        data:
          type: object
          properties:
            id:
              type: string
              example: "abc123xyz"
            nama_lengkap:
              type: string
            jenis_kelamin:
              type: string
            tanggal_lahir:
              type: string
            tempat_lahir:
              type: string
            nomor_kependudukan:
              type: string
            nomor_telepon:
              type: string
            email:
              type: string
            pekerjaan:
              type: string
            pendidikan:
              type: string
            status_perkawinan:
              type: string
            agama:
              type: string
            alamat:
              type: string
            bank_account:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                nama_bank:
                  type: string
                nomor_rekening:
                  type: string
                nama_akun:
                  type: string
                file_ktp_url:
                  type: string

    ValidationError:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          example: "The given data was invalid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    NotFoundError:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          example: "ID Identitas tidak valid."
